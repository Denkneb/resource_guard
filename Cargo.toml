[package]
name = "resource-guard"
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
description = "A lightweight Linux resource monitor and process guard"
license = "MIT"
repository = "https://github.com/Denkneb/resource_guard"
homepage = "https://github.com/Denkneb/resource_guard"
readme = "README.md"
keywords = ["linux", "monitoring", "process", "resources", "daemon"]
categories = ["command-line-utilities", "os::linux-apis"]
include = [
    ".github/workflows/release.yml",
    "src/**",
    "tests/**",
    "packaging/**",
    "scripts/package-release.sh",
    "Cargo.toml",
    "Cargo.lock",
    "README.md",
    "CHANGELOG.md",
    "CONTRIBUTING.md",
    "SECURITY.md",
    "LICENSE",
    "config.example.toml",
]

[dependencies]
clap = { version = "4.6.4", features = ["derive"] }
futures-util = { version = "0.3.31", default-features = false, features = ["async-await", "std"] }
rustix = { version = "1.1.4", features = ["net", "process"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
tokio = { version = "1.53.1", features = ["io-util", "macros", "net", "rt", "signal", "sync", "time"] }
toml = "1.1.4"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
zbus = { version = "5.19.0", default-features = false, features = ["tokio"] }

[dev-dependencies]
tempfile = "3.27.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
