[package]
name = "resource-guard"
version = "0.1.0"
edition = "2024"
description = "A lightweight Linux resource monitor and process guard"
license = "MIT"

[dependencies]
clap = { version = "4.6.4", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
sysinfo = { version = "0.38.4", default-features = false, features = ["system"] }
toml = "1.1.4"

[dev-dependencies]
tempfile = "3.27.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
