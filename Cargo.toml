[package]
name = "resource-guard"
version = "0.1.0"
edition = "2024"
description = "A lightweight Linux resource monitor and process guard"
license = "MIT"

[dependencies]
clap = { version = "4.6.4", features = ["derive"] }
rustix = { version = "1.1.4", features = ["net", "process"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sysinfo = { version = "0.38.4", default-features = false, features = ["system"] }
tokio = { version = "1.53.1", features = ["io-util", "macros", "net", "rt", "signal", "sync", "time"] }
toml = "1.1.4"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }

[dev-dependencies]
tempfile = "3.27.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
