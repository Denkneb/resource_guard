name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Test and publish Linux release
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run tests
        run: cargo test --locked --all-targets --all-features

      - name: Build reproducible release archive
        run: ./scripts/package-release.sh "${GITHUB_REF_NAME#v}" dist

      - name: Verify checksum
        working-directory: dist
        run: sha256sum --check resource-guard-*.tar.gz.sha256

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          dist/resource-guard-*.tar.gz
          dist/resource-guard-*.tar.gz.sha256
          --verify-tag
          --generate-notes
          --title "Resource Guard ${GITHUB_REF_NAME#v}"
