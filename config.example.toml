[monitor]
poll_interval_seconds = 5
consecutive_samples = 3
minimum_duration_seconds = 10
cooldown_seconds = 600
max_cpu_percent = 90.0
max_memory_mib = 2048

[memory_pressure]
enabled = true
warning_available_percent = 15.0
critical_available_percent = 8.0
emergency_available_mib = 512
critical_swap_used_percent = 90.0
critical_psi_full_avg10 = 5.0
critical_samples = 2
warning_poll_interval_ms = 1000
critical_poll_interval_ms = 500
recovery_available_percent = 20.0

[emergency]
action = "notify_only"
allow_sigkill = false
action_available_mib = 1024
action_psi_full_avg10 = 5.0
term_grace_seconds = 3
action_cooldown_seconds = 30
allowed_names = []
allowed_executables = []
exempt_names = ["resource-guard"]
exempt_executables = []

[stale_workloads]
enabled = true
# Build the stale inventory always; only gate desktop notifications on pressure.
# Set to false to receive the two-step actionable stale group notification
# (summary "Подробнее" -> "Завершить все деревья"/"Назад") at Normal pressure.
notify_only_under_memory_pressure = true
candidate_names = ["pytest", "coverage", "black", "pre-commit"]
launcher_names = ["uv", "pytest", "coverage", "black", "pre-commit"]
ignored_root_names = []
minimum_age_minutes = 60
minimum_tree_memory_mib = 256
minimum_group_memory_mib = 512
minimum_group_trees = 2
maximum_cpu_percent = 5.0
consecutive_samples = 3
notification_cooldown_minutes = 30

[background_workloads]
enabled = true
minimum_age_minutes = 60
minimum_memory_mib = 256
large_memory_mib = 512
growth_window_minutes = 30
minimum_memory_growth_mib = 128
minimum_process_count_growth = 2
maximum_cpu_percent = 5.0
consecutive_samples = 3
sample_interval_seconds = 60
notification_cooldown_minutes = 30
ignored_root_names = []
ignored_root_executables = []

[termination]
grace_period_seconds = 10

[processes]
protected_names = ["resource-guard"]
protected_executables = []
ignored_names = []
ignored_executables = []

[notifications]
enabled = true
timeout_seconds = 15
